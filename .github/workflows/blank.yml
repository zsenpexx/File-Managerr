name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Keystore and Environment
        run: |
          # Restore debug keystore from committed base64 if not already present
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            echo "Restoring debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          # Ensure .env exists for Secrets Gradle Plugin
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi
      - name: Build with Gradle
        run: |
          BUILD_TYPE="${{ inputs.build_type || 'debug' }}"
          if [ "$BUILD_TYPE" = "release" ]; then
            echo "Building Release APK..."
            if [ -f "./gradlew" ]; then
              chmod +x ./gradlew
              ./gradlew assembleRelease --no-daemon --stacktrace
            else
              gradle assembleRelease --no-daemon --stacktrace
            fi
          else
            echo "Building Debug APK..."
            if [ -f "./gradlew" ]; then
              chmod +x ./gradlew
              ./gradlew assembleDebug --no-daemon --stacktrace
            else
              gradle assembleDebug --no-daemon --stacktrace
            fi
          fi
      - name: Locate Generated APK
        id: find-apk
        run: |
          echo "Listing generated APKs:"
          find app/build/outputs/apk -name "*.apk" -ls || true
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            echo "Found APK at $APK_PATH"
            echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          else
            echo "ERROR: No APK generated!"
            exit 1
          fi
      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ inputs.build_type || 'debug' }}-apk
          path: app/build/outputs/apk/**/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Add Build Summary
        run: |
          echo "### 🚀 Android APK Build Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Type:** \`${{ inputs.build_type || 'debug' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Generated APK:** \`${{ steps.find-apk.outputs.apk_path }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Download:** Head to the **Artifacts** section below to download your \`.apk\`." >> $GITHUB_STEP_SUMMARY
